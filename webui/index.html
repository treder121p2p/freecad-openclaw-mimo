<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeCAD — AI 3D Modeling</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }
    .container { display: flex; height: 100vh; gap: 2px; }

    /* VNC Panel */
    .vnc-panel {
      flex: 2;
      background: #000;
      position: relative;
      min-width: 0;
    }
    .vnc-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .vnc-panel .status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      font-size: 11px;
      padding: 4px 10px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
    }

    /* Chat Panel */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #16213e;
      min-width: 320px;
      max-width: 480px;
    }
    .chat-header {
      background: #0f3460;
      padding: 14px 18px;
      border-bottom: 2px solid #e94560;
    }
    .chat-header h2 { font-size: 15px; font-weight: 600; color: #fff; }
    .chat-header .subtitle { font-size: 11px; color: #aaa; margin-top: 2px; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 95%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #e94560;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #1a1a2e;
      color: #ddd;
      border-bottom-left-radius: 4px;
      border: 1px solid #333;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: #888;
      font-size: 11px;
      padding: 4px 10px;
    }
    .msg .label {
      font-size: 10px;
      color: #aaa;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .msg pre {
      background: #0d1117;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      margin-top: 6px;
      border: 1px solid #333;
    }
    .msg code {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
    }
    .msg .result-label {
      font-size: 10px;
      color: #4ec9b0;
      margin-top: 8px;
      text-transform: uppercase;
    }
    .msg .error { color: #f44; }

    .chat-input {
      padding: 12px 14px;
      background: #0f3460;
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
    }
    .chat-input textarea {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }
    .chat-input textarea:focus { border-color: #e94560; }
    .chat-input button {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .chat-input button:hover { background: #c73e54; }
    .chat-input button:disabled { background: #555; cursor: not-allowed; }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 8px 14px;
      color: #888;
      font-size: 12px;
      font-style: italic;
    }
    .typing-indicator.active { display: block; }

    .quick-actions {
      padding: 8px 14px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .quick-btn {
      background: #1a1a2e;
      color: #aaa;
      border: 1px solid #444;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-btn:hover { background: #e94560; color: #fff; border-color: #e94560; }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="vnc-panel">
      <div class="status-bar">
        <span>🖥 FreeCAD 3D View</span>
        <span id="vnc-status">Connecting...</span>
      </div>
      <iframe id="vnc-frame" src="about:blank"></iframe>
    </div>

    <div class="chat-panel">
      <div class="chat-header">
        <h2>💬 AI 3D Modeling Assistant</h2>
        <div class="subtitle">MiMo + FreeCAD — опишите задачу на русском</div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="msg system">Подключение к FreeCAD...</div>
      </div>

      <div class="quick-actions">
        <button class="quick-btn" onclick="quickAction('Создай куб 10x10x10 мм')">📐 Куб</button>
        <button class="quick-btn" onclick="quickAction('Создай цилиндр r=5mm h=20mm')">🔵 Цилиндр</button>
        <button class="quick-btn" onclick="quickAction('Покажи список объектов')">📋 Объекты</button>
        <button class="quick-btn" onclick="quickAction('Экспортируй в STL')">💾 STL</button>
      </div>

      <div class="typing-indicator" id="typing">🤖 AI анализирует и генерирует код...</div>

      <div class="chat-input">
        <textarea id="user-input" placeholder="Опишите 3D модель..." rows="1"
                  onkeydown="handleKey(event)"></textarea>
        <button id="send-btn" onclick="sendMessage()">Отправить</button>
      </div>
    </div>
  </div>

  <script>
    var messagesEl = document.getElementById('chat-messages');
    var inputEl = document.getElementById('user-input');
    var sendBtn = document.getElementById('send-btn');
    var typingEl = document.getElementById('typing');
    var conversationHistory = [];

    // Init VNC
    fetch('/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
      document.getElementById('vnc-frame').src = '/vnc.html?autoconnect=1&resize=scale&path=/websockify';
      document.getElementById('vnc-status').textContent = 'Connected';
      document.getElementById('vnc-status').style.color = '#0f0';
    });

    // Check bridge status
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'ping', history: [] })
    }).then(function(r) { return r.json(); }).then(function(d) {
      var el = document.querySelector('.chat-header .subtitle');
      if (d.type === 'error') el.textContent = '⚠️ AI Bridge offline — direct RPC mode';
      else el.textContent = 'MiMo + FreeCAD — опишите задачу на русском';
    }).catch(function() {
      document.querySelector('.chat-header .subtitle').textContent = '⚠️ AI Bridge offline';
    });

    function addMessage(role, text) {
      var div = document.createElement('div');
      div.className = 'msg ' + role;
      if (role === 'user') {
        div.innerHTML = '<div class="label">Вы</div>' + escHtml(text);
      } else if (role === 'assistant') {
        // Parse code blocks and results
        var html = text;
        // Code blocks
        html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
          return '<pre><code>' + escHtml(code) + '</code></pre>';
        });
        // Inline code
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        // Bold
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        div.innerHTML = '<div class="label">🤖 AI</div>' + html;
      } else {
        div.textContent = text;
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function quickAction(text) {
      inputEl.value = text;
      sendMessage();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sendMessage() {
      var text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      sendBtn.disabled = true;
      addMessage('user', text);
      typingEl.classList.add('active');

      conversationHistory.push({ role: 'user', content: text });

      fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: conversationHistory })
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.error) {
          addMessage('system', '❌ Ошибка: ' + data.error);
        } else {
          addMessage('assistant', data.reply || 'Нет ответа');
          conversationHistory.push({ role: 'assistant', content: data.reply || '' });
        }
      }).catch(function(err) {
        addMessage('system', '❌ Ошибка соединения: ' + err.message);
      }).finally(function() {
        typingEl.classList.remove('active');
        sendBtn.disabled = false;
        inputEl.focus();
      });
    }
  </script>
</body>
</html>
