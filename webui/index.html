<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeCAD — AI 3D Modeling</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
    }
    .container { display: flex; height: 100vh; gap: 2px; }

    /* VNC Panel */
    .vnc-panel {
      flex: 2;
      background: #000;
      position: relative;
      min-width: 0;
    }
    .vnc-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .vnc-panel .status-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7);
      color: #0f0;
      font-size: 11px;
      padding: 4px 10px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
    }

    /* Chat Panel */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #16213e;
      min-width: 360px;
      max-width: 560px;
    }
    .chat-header {
      background: #0f3460;
      padding: 12px 18px;
      border-bottom: 2px solid #e94560;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-header-left h2 { font-size: 15px; font-weight: 600; color: #fff; }
    .chat-header-left .subtitle { font-size: 11px; color: #aaa; margin-top: 2px; }
    .chat-header-actions { display: flex; gap: 6px; align-items: center; }
    .header-btn {
      background: #1a1a2e;
      color: #aaa;
      border: 1px solid #444;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .header-btn:hover { background: #e94560; color: #fff; border-color: #e94560; }

    /* Model Selector */
    .model-selector {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .model-btn {
      background: #1a1a2e;
      color: #888;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .model-btn.active {
      background: #e94560;
      color: #fff;
      border-color: #e94560;
    }
    .model-btn:hover { border-color: #e94560; }
    .model-btn .tag {
      font-size: 8px;
      opacity: 0.7;
      margin-left: 2px;
    }

    /* Step Tracker */
    .step-tracker {
      display: none;
      padding: 10px 14px;
      background: #0d1b2a;
      border-bottom: 1px solid #333;
    }
    .step-tracker.active { display: block; }
    .step-tracker h3 {
      font-size: 12px;
      color: #e94560;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .steps-list { display: flex; flex-direction: column; gap: 6px; }
    .step-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 6px 10px;
      background: #1a1a2e;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .step-item .step-num {
      background: #444;
      color: #aaa;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .step-item.active .step-num { background: #e94560; color: #fff; }
    .step-item.done .step-num { background: #2d6a4f; color: #fff; }
    .step-item.error .step-num { background: #d32f2f; color: #fff; }
    .step-item .step-text { flex: 1; color: #ccc; }
    .step-item.active .step-text { color: #fff; }
    .step-item .step-status { font-size: 11px; }
    .step-item.done .step-status { color: #4ec9b0; }
    .step-item.error .step-status { color: #f44; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 95%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #e94560;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #1a1a2e;
      color: #ddd;
      border-bottom-left-radius: 4px;
      border: 1px solid #333;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: #888;
      font-size: 11px;
      padding: 4px 10px;
    }
    .msg .label {
      font-size: 10px;
      color: #aaa;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .msg pre {
      background: #0d1117;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      margin-top: 6px;
      border: 1px solid #333;
    }
    .msg code {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
    }
    .msg .result-label {
      font-size: 10px;
      color: #4ec9b0;
      margin-top: 8px;
      text-transform: uppercase;
    }
    .msg .error { color: #f44; }
    .msg img {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 6px;
      cursor: pointer;
    }

    .chat-input {
      padding: 12px 14px;
      background: #0f3460;
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .chat-input textarea {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      min-height: 60px;
      max-height: 200px;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.4;
    }
    .chat-input textarea:focus { border-color: #e94560; }
    .chat-input button {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      height: 42px;
    }
    .chat-input button:hover { background: #c73e54; }
    .chat-input button:disabled { background: #555; cursor: not-allowed; }

    .input-row {
      padding: 0 14px 6px;
      background: #0f3460;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-hint {
      font-size: 10px;
      color: #666;
      flex: 1;
    }
    .attach-btn {
      background: #1a1a2e;
      color: #aaa;
      border: 1px solid #444;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .attach-btn:hover { background: #e94560; color: #fff; border-color: #e94560; }
    .attach-btn.active { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }

    .image-preview {
      display: none;
      padding: 6px 14px;
      background: #0f3460;
    }
    .image-preview.active { display: flex; gap: 8px; align-items: center; }
    .image-preview img {
      max-height: 60px;
      border-radius: 6px;
      border: 1px solid #444;
    }
    .image-preview .remove-img {
      background: #d32f2f;
      color: #fff;
      border: none;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 8px 14px;
      color: #888;
      font-size: 12px;
      font-style: italic;
    }
    .typing-indicator.active { display: block; }

    .quick-actions {
      padding: 8px 14px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .quick-btn {
      background: #1a1a2e;
      color: #aaa;
      border: 1px solid #444;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-btn:hover { background: #e94560; color: #fff; border-color: #e94560; }
    .run-code-btn { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }
    .run-code-btn:hover { background: #1a4731; }

    .code-editor {
      display: none;
      padding: 8px 14px;
      background: #0d1b2a;
      border-top: 1px solid #333;
    }
    .code-editor.active { display: block; }
    .code-editor textarea {
      width: 100%;
      background: #0d1117;
      border: 1px solid #444;
      color: #4ec9b0;
      padding: 8px;
      border-radius: 6px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
      resize: vertical;
      min-height: 80px;
      outline: none;
    }
    .code-editor textarea:focus { border-color: #4ec9b0; }
    .code-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .execute-btn {
      background: #4ec9b0;
      color: #0d1117;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .execute-btn:hover { background: #3db89f; }
    .execute-btn:disabled { background: #555; cursor: not-allowed; }
    .clear-btn { background: #d32f2f; color: #fff; }
    .clear-btn:hover { background: #b71c1c; }

    .export-panel {
      padding: 6px 14px;
      background: #0d1b2a;
      display: flex;
      gap: 6px;
      align-items: center;
      border-top: 1px solid #333;
    }
    .export-label {
      font-size: 11px;
      color: #888;
    }
    .export-btn {
      background: #1a1a2e;
      color: #4ec9b0;
      border: 1px solid #2d6a4f;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .export-btn:hover { background: #2d6a4f; color: #fff; }
    .export-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .session-info {
      font-size: 10px;
      color: #555;
      padding: 4px 14px;
      background: #0d1b2a;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="vnc-panel">
      <div class="status-bar">
        <span>🖥 FreeCAD 3D View</span>
        <span id="vnc-status">Connecting...</span>
      </div>
      <iframe id="vnc-frame" src="about:blank"></iframe>
    </div>

    <div class="chat-panel">
      <div class="chat-header">
        <div class="chat-header-left">
          <h2>💬 AI 3D Modeling</h2>
          <div class="subtitle" id="header-subtitle">MiMo + FreeCAD — опишите задачу</div>
        </div>
        <div class="chat-header-actions">
          <div class="model-selector">
            <button class="model-btn active" data-model="xiaomi/mimo-v2.5" onclick="selectModel(this)">
              💰 MiMo <span class="tag">Дешёвая</span>
            </button>
            <button class="model-btn" data-model="xiaomi/mimo-v2.5-pro" onclick="selectModel(this)">
              🔥 Pro <span class="tag">Сильная</span>
            </button>
            <button class="model-btn" data-model="qwen/qwen2.5-vl-72b-instruct" onclick="selectModel(this)">
              👁 Vision <span class="tag">Картинки</span>
            </button>
          </div>
          <button class="header-btn" onclick="exportChat()">📥</button>
          <button class="header-btn" onclick="clearChat()">🗑</button>
        </div>
      </div>

      <!-- Step Tracker -->
      <div class="step-tracker" id="step-tracker">
        <h3>🔄 Workflow</h3>
        <div class="steps-list" id="steps-list"></div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="msg system">Подключение к FreeCAD...</div>
      </div>

      <div class="quick-actions">
        <button class="quick-btn" onclick="quickAction('Создай куб 10x10x10 мм')">📐 Куб</button>
        <button class="quick-btn" onclick="quickAction('Создай цилиндр r=5mm h=20mm')">🔵 Цилиндр</button>
        <button class="quick-btn" onclick="quickAction('Покажи список объектов')">📋 Объекты</button>
        <button class="quick-btn" onclick="quickAction('Сделай вырез в кубе цилиндром')">✂️ Boolean</button>
        <button class="quick-btn run-code-btn" onclick="toggleCodeEditor()">▶️ Код</button>
      </div>

      <!-- Code Editor (hidden by default) -->
      <div class="code-editor" id="code-editor">
        <textarea id="code-input" placeholder="import FreeCAD, Part&#10;doc = FreeCAD.activeDocument() or FreeCAD.newDocument(&quot;MyDoc&quot;)&#10;box = doc.addObject(&quot;Part::Box&quot;, &quot;Box&quot;)&#10;box.Length = 10.0&#10;box.Width = 10.0&#10;box.Height = 10.0&#10;doc.recompute()" rows="6"></textarea>
        <div class="code-actions">
          <button class="execute-btn" onclick="executeCode()">▶️ Выполнить</button>
          <button class="execute-btn clear-btn" onclick="clearCode()">🗑 Очистить</button>
        </div>
      </div>

      <!-- Export Panel -->
      <div class="export-panel">
        <span class="export-label">💾 Экспорт:</span>
        <button class="export-btn" onclick="exportFile('stl')">📥 STL</button>
        <button class="export-btn" onclick="exportFile('3mf')">📥 3MF</button>
      </div>

      <div class="typing-indicator" id="typing">🤖 AI анализирует и генерирует код...</div>

      <!-- Image Preview -->
      <div class="image-preview" id="image-preview">
        <img id="preview-img" src="" alt="preview">
        <button class="remove-img" onclick="removeImage()">✕ Удалить</button>
      </div>

      <div class="chat-input">
        <textarea id="user-input" placeholder="Опишите 3D модель... (Enter — отправить, Shift+Enter — перенос)" rows="3"
                  onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button id="send-btn" onclick="sendMessage()">Отправить</button>
      </div>
      <div class="input-row">
        <span class="input-hint">Enter — отправить · Shift+Enter — перенос</span>
        <label class="attach-btn" id="attach-btn" title="Прикрепить изображение">
          📷 Фото
          <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
        </label>
      </div>

      <div class="session-info">
        <span id="session-id">Session: ...</span>
        <span id="msg-count">0 messages</span>
      </div>
    </div>
  </div>

  <script>
    var messagesEl = document.getElementById('chat-messages');
    var inputEl = document.getElementById('user-input');
    var sendBtn = document.getElementById('send-btn');
    var typingEl = document.getElementById('typing');
    var stepTracker = document.getElementById('step-tracker');
    var stepsList = document.getElementById('steps-list');
    var conversationHistory = [];
    var sessionId = localStorage.getItem('freecad_session_id') || generateSessionId();
    var steps = [];
    var currentModel = localStorage.getItem('freecad_model') || 'xiaomi/mimo-v2.5';
    var pendingImage = null; // base64 data URL

    localStorage.setItem('freecad_session_id', sessionId);
    document.getElementById('session-id').textContent = 'Session: ' + sessionId.substring(0, 8);

    // Restore model selection
    document.querySelectorAll('.model-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.model === currentModel);
    });

    function generateSessionId() {
      return 'sess_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
    }

    function selectModel(btn) {
      document.querySelectorAll('.model-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentModel = btn.dataset.model;
      localStorage.setItem('freecad_model', currentModel);
      var names = {
        'xiaomi/mimo-v2.5': 'MiMo v2.5 (дешёвая)',
        'xiaomi/mimo-v2.5-pro': 'MiMo v2.5 Pro (сильная)',
        'qwen/qwen2.5-vl-72b-instruct': 'Qwen 2.5 VL (vision)'
      };
      addMessage('system', 'Модель: ' + (names[currentModel] || currentModel));
    }

    // Auto-resize textarea
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    // --- Image Upload ---
    function handleImageUpload(event) {
      var file = event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        addMessage('system', '❌ Можно загружать только изображения');
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        addMessage('system', '❌ Файл слишком большой (макс 10MB)');
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e) {
        pendingImage = e.target.result; // data:image/...;base64,...
        document.getElementById('preview-img').src = pendingImage;
        document.getElementById('image-preview').classList.add('active');
        document.getElementById('attach-btn').classList.add('active');
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function removeImage() {
      pendingImage = null;
      document.getElementById('image-preview').classList.remove('active');
      document.getElementById('attach-btn').classList.remove('active');
    }

    // Init VNC
    fetch('/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
      document.getElementById('vnc-frame').src = '/vnc.html?autoconnect=1&resize=scale&path=/websockify';
      document.getElementById('vnc-status').textContent = 'Connected';
      document.getElementById('vnc-status').style.color = '#0f0';
    });

    // Load saved chat
    loadSavedChat();
    loadServerHistory();

    // Check bridge status
    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'ping', history: [], session_id: sessionId, model: currentModel })
    }).then(function(r) { return r.json(); }).then(function(d) {
      var el = document.getElementById('header-subtitle');
      if (d.type === 'error') el.textContent = '⚠️ AI Bridge offline';
      else el.textContent = 'MiMo + FreeCAD — опишите задачу';
    }).catch(function() {
      document.getElementById('header-subtitle').textContent = '⚠️ AI Bridge offline';
    });

    function addMessage(role, text, skipSave) {
      var div = document.createElement('div');
      div.className = 'msg ' + role;
      if (role === 'user') {
        var html = escHtml(text);
        // Show attached image in message
        if (pendingImage && !skipSave) {
          html += '<br><img src="' + pendingImage + '" style="max-width:200px;border-radius:6px;margin-top:6px">';
        }
        div.innerHTML = '<div class="label">Вы</div>' + html;
      } else if (role === 'assistant') {
        var ahtml = text;
        ahtml = ahtml.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
          return '<pre><code>' + escHtml(code) + '</code></pre>';
        });
        ahtml = ahtml.replace(/`([^`]+)`/g, '<code>$1</code>');
        ahtml = ahtml.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        div.innerHTML = '<div class="label">🤖 AI</div>' + ahtml;
      } else {
        div.textContent = text;
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      if (!skipSave) {
        var msgObj = { role: role, content: text, time: Date.now() };
        if (role === 'user' && pendingImage) {
          msgObj.image = pendingImage;
        }
        conversationHistory.push(msgObj);
        saveChat();
      }
      updateMsgCount();
      return div;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // --- Multi-step workflow tracker ---
    function startWorkflow(description, stepTexts) {
      steps = stepTexts.map(function(t, i) {
        return { num: i + 1, text: t, status: 'pending' };
      });
      renderSteps();
      stepTracker.classList.add('active');
      addMessage('system', '🔄 Workflow: ' + description);
    }

    function updateStep(num, status, statusText) {
      for (var i = 0; i < steps.length; i++) {
        if (steps[i].num === num) {
          steps[i].status = status;
          if (statusText) steps[i].statusText = statusText;
          break;
        }
      }
      renderSteps();
    }

    function renderSteps() {
      stepsList.innerHTML = '';
      steps.forEach(function(s) {
        var div = document.createElement('div');
        div.className = 'step-item ' + s.status;
        var statusIcon = s.status === 'done' ? '✓' : s.status === 'active' ? '⏳' : s.status === 'error' ? '✗' : '○';
        div.innerHTML = '<div class="step-num">' + s.num + '</div>' +
          '<div class="step-text">' + escHtml(s.text) + '</div>' +
          '<div class="step-status">' + statusIcon + (s.statusText || '') + '</div>';
        stepsList.appendChild(div);
      });
    }

    function detectWorkflow(text) {
      var lower = text.toLowerCase();
      if (lower.indexOf('вырез') !== -1 || lower.indexOf('boolean') !== -1 || lower.indexOf('объедин') !== -1 ||
          lower.indexOf('пересеч') !== -1 || lower.indexOf('cut') !== -1 || lower.indexOf('union') !== -1) {
        return {
          description: 'Boolean операция',
          steps: ['Создание базового тела', 'Создание тела для выреза', 'Выполнение boolean операции', 'Результат']
        };
      }
      if (lower.indexOf('модел') !== -1 && (lower.indexOf('шаг') !== -1 || lower.indexOf('этап') !== -1 || lower.indexOf('поэтапно') !== -1)) {
        return {
          description: 'Пошаговое создание модели',
          steps: ['Анализ запроса', 'Создание компонентов', 'Сборка модели', 'Финальная проверка']
        };
      }
      if (lower.indexOf('assembly') !== -1 || lower.indexOf('сборк') !== -1) {
        return {
          description: 'Сборка компонентов',
          steps: ['Загрузка компонентов', 'Позиционирование', 'Соединение', 'Проверка']
        };
      }
      return null;
    }

    // --- Code Editor ---
    function toggleCodeEditor() {
      var editor = document.getElementById('code-editor');
      editor.classList.toggle('active');
      if (editor.classList.contains('active')) {
        document.getElementById('code-input').focus();
      }
    }

    function executeCode() {
      var code = document.getElementById('code-input').value.trim();
      if (!code) {
        addMessage('system', '❌ Введите код для выполнения');
        return;
      }
      var btn = document.querySelector('.execute-btn');
      if (btn) btn.disabled = true;
      addMessage('system', '▶️ Выполняю код...');

      fetch('/api/execute', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code })
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.status === 'ok') {
          addMessage('assistant', '✅ Код выполнен\n\n```python\n' + code + '\n```\n\n**Результат:**\n```\n' + (data.output || 'OK') + '\n```');
        } else {
          addMessage('system', '❌ Ошибка: ' + (data.error || 'Unknown'));
        }
      }).catch(function(err) {
        addMessage('system', '❌ Ошибка: ' + err.message);
      }).finally(function() {
        if (btn) btn.disabled = false;
      });
    }

    function clearCode() {
      document.getElementById('code-input').value = '';
    }

    function quickAction(text) {
      inputEl.value = text;
      autoResize(inputEl);
      sendMessage();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sendMessage() {
      var text = inputEl.value.trim();
      if (!text && !pendingImage) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;
      addMessage('user', text || '(изображение)');
      typingEl.classList.add('active');

      // Build request
      var requestBody = {
        message: text,
        history: conversationHistory.slice(-20),
        session_id: sessionId,
        model: currentModel
      };

      // Attach image if present
      if (pendingImage) {
        requestBody.image = pendingImage;
        removeImage();
      }

      // Detect multi-step workflow
      var workflow = detectWorkflow(text);
      if (workflow) {
        startWorkflow(workflow.description, workflow.steps);
        updateStep(1, 'active');
      }

      fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.error) {
          addMessage('system', '❌ Ошибка: ' + data.error);
          if (workflow) updateStep(1, 'error', 'Ошибка');
        } else {
          addMessage('assistant', data.reply || 'Нет ответа');
          if (workflow) {
            if (data.type === 'code_execution') {
              steps.forEach(function(s) { s.status = 'done'; s.statusText = '✓'; });
              renderSteps();
            } else {
              updateStep(1, 'done', '✓');
            }
          }
        }
      }).catch(function(err) {
        addMessage('system', '❌ Ошибка соединения: ' + err.message);
        if (workflow) updateStep(1, 'error', err.message);
      }).finally(function() {
        typingEl.classList.remove('active');
        sendBtn.disabled = false;
        inputEl.focus();
        if (workflow) {
          setTimeout(function() { stepTracker.classList.remove('active'); }, 10000);
        }
      });
    }

    // --- Chat persistence ---
    function saveChat() {
      try {
        localStorage.setItem('freecad_chat_' + sessionId, JSON.stringify(conversationHistory));
      } catch(e) {}
      fetch('/api/session/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, messages: conversationHistory })
      }).catch(function() {});
    }

    function loadSavedChat() {
      try {
        var saved = localStorage.getItem('freecad_chat_' + sessionId);
        if (saved) {
          conversationHistory = JSON.parse(saved);
          conversationHistory.forEach(function(msg) {
            addMessage(msg.role, msg.content, true);
          });
        }
      } catch(e) {}
    }

    function loadServerHistory() {
      fetch('/api/session/load?session_id=' + sessionId)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.messages && data.messages.length > 0 && conversationHistory.length === 0) {
            conversationHistory = data.messages;
            conversationHistory.forEach(function(msg) {
              addMessage(msg.role, msg.content, true);
            });
          }
        }).catch(function() {});
    }

    function clearChat() {
      if (!confirm('Очистить историю чата?')) return;
      conversationHistory = [];
      steps = [];
      stepTracker.classList.remove('active');
      messagesEl.innerHTML = '';
      addMessage('system', 'Чат очищен');
      saveChat();
      fetch('/api/session/clear', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId })
      }).catch(function() {});
      sessionId = generateSessionId();
      localStorage.setItem('freecad_session_id', sessionId);
      document.getElementById('session-id').textContent = 'Session: ' + sessionId.substring(0, 8);
    }

    function exportChat() {
      var text = conversationHistory.map(function(m) {
        var role = m.role === 'user' ? 'Вы' : m.role === 'assistant' ? 'AI' : 'System';
        return '[' + role + ']\n' + m.content;
      }).join('\n\n---\n\n');
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'freecad-chat-' + sessionId.substring(0, 8) + '.txt';
      a.click();
    }

    function exportFile(format) {
      var btn = document.querySelector('.export-btn[onclick="exportFile(\'' + format + '\')"]');
      if (btn) btn.disabled = true;
      addMessage('system', '💾 Экспорт ' + format.toUpperCase() + '...');

      var filename = 'freecad_model_' + Date.now();

      fetch('/api/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ format: format, filename: filename })
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.status === 'ok' && data.data) {
          // Decode base64 and trigger download
          var byteString = atob(data.data);
          var ab = new ArrayBuffer(byteString.length);
          var ia = new Uint8Array(ab);
          for (var i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
          }
          var mimeType = format === 'stl' ? 'model/stl' : 'model/3mf';
          var blob = new Blob([ab], { type: mimeType });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = data.filename || ('model.' + format);
          a.click();
          URL.revokeObjectURL(a.href);
          addMessage('system', '✅ ' + data.filename + ' (' + formatBytes(data.size) + ') — сохранён');
        } else {
          addMessage('system', '❌ Ошибка экспорта: ' + (data.message || data.error || 'Unknown'));
        }
      }).catch(function(err) {
        addMessage('system', '❌ Ошибка экспорта: ' + err.message);
      }).finally(function() {
        if (btn) btn.disabled = false;
      });
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function updateMsgCount() {
      document.getElementById('msg-count').textContent = conversationHistory.length + ' messages';
    }

    inputEl.focus();
  </script>
</body>
</html>
